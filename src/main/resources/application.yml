server:
  port: ${IMG_MOCK_PORT:10917}
  address: ${IMG_MOCK_HOST:127.0.0.1}

spring:
  application:
    name: img-mock-server

img-mock:
  image-dir: ${IMG_MOCK_IMAGE_DIR:images}
  cache-enabled: true
  swift-sample-file: ${IMG_MOCK_SWIFT_SAMPLE:sample.txt}

logging:
  level:
    com.woori.ajs.imgmock: INFO
